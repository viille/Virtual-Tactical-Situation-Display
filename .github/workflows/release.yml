name: Build And Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  resolve-version:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Resolve Version From Tag
        id: version
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v', 'V')
          "version=$version" >> $env:GITHUB_OUTPUT

  build-release:
    needs: resolve-version
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore tactical-situation-display.sln

      - name: Verify MSFS 2024 AAR Bridge Package
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.resolve-version.outputs.version }}
        run: |
          $numericVersion = $env:RELEASE_VERSION.Split('-')[0]
          if ([version]$numericVersion -ge [version]'0.16.0') {
            $package = 'src/TacticalDisplay.App/Resources/MSFS/vtsd-aar-bridge'
            $module = Join-Path $package 'modules/vtsd_aar_bridge.wasm'
            $archive = 'src/TacticalDisplay.App/Resources/MSFS/vtsd-aar-bridge.zip'
            if (-not (Test-Path (Join-Path $package 'manifest.json')) -or -not (Test-Path (Join-Path $package 'layout.json')) -or -not (Test-Path $module) -or -not (Test-Path $archive)) {
              throw 'VTSD v0.16.0 and newer releases require the built and embedded MSFS 2024 AAR Bridge package. Build it with src/MSFS.AarBridge/Build-MsfsAarBridge.ps1 and include the generated package and archive.'
            }
          }

      - name: Report Mapbox Defaults
        shell: pwsh
        env:
          MAPBOX_ACCESS_TOKEN: ${{ secrets.MAPBOX_ACCESS_TOKEN }}
          MAPBOX_BASEMAP_STYLE_URL: ${{ vars.MAPBOX_BASEMAP_STYLE_URL }}
          MAPBOX_AREAS_STYLE_URL: ${{ vars.AREASMAPSTYLEURL }}
          VTSD_INGEST_KEY: ${{ secrets.VTSD_INGEST_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:MAPBOX_ACCESS_TOKEN)) {
            Write-Host "MAPBOX_ACCESS_TOKEN is empty. Release will use user-provided local Mapbox configuration."
          }

          if ([string]::IsNullOrWhiteSpace($env:MAPBOX_BASEMAP_STYLE_URL)) {
            Write-Host "MAPBOX_BASEMAP_STYLE_URL is empty. Release will use the app fallback style URL."
          }

          if ([string]::IsNullOrWhiteSpace($env:MAPBOX_AREAS_STYLE_URL)) {
            Write-Host "MAPBOX_AREAS_STYLE_URL is empty. Area layers will use user-provided local Mapbox configuration."
          }

          if ([string]::IsNullOrWhiteSpace($env:VTSD_INGEST_KEY)) {
            Write-Host "VTSD_INGEST_KEY is empty. Release will skip anonymous telemetry pings."
          }

      - name: Publish App
        shell: pwsh
        env:
          MAPBOX_ACCESS_TOKEN: ${{ secrets.MAPBOX_ACCESS_TOKEN }}
          MAPBOX_BASEMAP_STYLE_URL: ${{ vars.MAPBOX_BASEMAP_STYLE_URL }}
          MAPBOX_AREAS_STYLE_URL: ${{ vars.AREASMAPSTYLEURL }}
          VTSD_INGEST_KEY: ${{ secrets.VTSD_INGEST_KEY }}
        run: |
          dotnet publish src/TacticalDisplay.App/TacticalDisplay.App.csproj `
            -c Release `
            -r win-x64 `
            -o out/app `
            -p:Version=${{ needs.resolve-version.outputs.version }} `
            -p:DefaultMapboxAccessToken="$env:MAPBOX_ACCESS_TOKEN" `
            -p:DefaultMapboxStyleUrl="$env:MAPBOX_BASEMAP_STYLE_URL" `
            -p:DefaultMapboxAreasStyleUrl="$env:MAPBOX_AREAS_STYLE_URL" `
            -p:DefaultTelemetryIngestKey="$env:VTSD_INGEST_KEY"

      - name: Generate Checksum
        shell: pwsh
        run: |
          $hash = Get-FileHash out/app/TacticalDisplay.App.exe -Algorithm SHA256
          "$($hash.Hash.ToLowerInvariant())  TacticalDisplay.App.exe" | Set-Content -NoNewline out/app/TacticalDisplay.App.exe.sha256

      - name: Upload Artifact
        uses: actions/upload-artifact@v6
        with:
          name: TacticalDisplay.App-${{ github.ref_name }}-win-x64-exe
          path: |
            out/app/TacticalDisplay.App.exe
            out/app/TacticalDisplay.App.exe.sha256

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $repo = "${{ github.repository }}"
          gh release view $tag --repo $repo *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag `
              out/app/TacticalDisplay.App.exe `
              out/app/TacticalDisplay.App.exe.sha256 `
              --repo $repo `
              --clobber
          } else {
            gh release create $tag `
              out/app/TacticalDisplay.App.exe `
              out/app/TacticalDisplay.App.exe.sha256 `
              --repo $repo `
              --title "VTSD $tag" `
              --generate-notes
          }
