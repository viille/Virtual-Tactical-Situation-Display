services:
  tactical-link:
    build:
      context: ../..
      dockerfile: src/TacticalLink.Server/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TACTICAL_LINK_LISTEN_URL: http://0.0.0.0:8080
      TACTICAL_LINK_INTEREST_RADIUS_NM: ${TACTICAL_LINK_INTEREST_RADIUS_NM:-200}
      TACTICAL_LINK_MAX_INTEREST_RADIUS_NM: ${TACTICAL_LINK_MAX_INTEREST_RADIUS_NM:-500}
      TACTICAL_LINK_AAR_REGISTRY_CACHE_PATH: ${TACTICAL_LINK_AAR_REGISTRY_CACHE_PATH:-/var/lib/tactical-link/aar-registry-cache.json}
    expose:
      - "8080"
    volumes:
      - tactical_link_data:/var/lib/tactical-link
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  caddy:
    image: caddy:2-alpine
    depends_on:
      - tactical-link
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  caddy_data:
  caddy_config:
  tactical_link_data:
